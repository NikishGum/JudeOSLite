name: Claim issue
run-name: 'Claim #${{ inputs.issue_number }} · ${{ github.actor }} · ${{ inputs.request_id }}'

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing V1 issue to claim
        required: true
        type: string
      request_id:
        description: Unique request ID generated by scripts/claim_issue.py
        required: true
        type: string
      dry_run:
        description: Check eligibility without assigning or changing labels
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

# Shared with issue-status.yml: assignment and label repair cannot race.
concurrency:
  group: issue-coordination-${{ inputs.issue_number }}
  cancel-in-progress: false
  queue: max

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check eligibility and assign the requesting human
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CLAIM_ACTOR: ${{ github.actor }}
          CLAIM_REQUEST_ID: ${{ inputs.request_id }}
          CLAIM_DRY_RUN: ${{ inputs.dry_run }}
        run: python3 .github/scripts/claim_issue.py
