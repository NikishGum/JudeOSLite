name: Issue status

on:
  issues:
    types: [opened, assigned, unassigned, closed, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing V1 issue to synchronize (does not assign it)
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-coordination-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Synchronize status from current state and assignment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          number = os.environ["ISSUE_NUMBER"]
          if not re.fullmatch(r"[1-9][0-9]*", number):
              raise SystemExit("Invalid issue number")
          url = (
              os.environ["GITHUB_API_URL"]
              + "/repos/" + os.environ["GITHUB_REPOSITORY"]
              + "/issues/" + number
          )
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(method, endpoint, data=None):
              body = None if data is None else json.dumps(data).encode()
              req = urllib.request.Request(
                  endpoint, data=body, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          # Read live state, not an earlier queued event.
          issue = request("GET", url)
          if "pull_request" in issue or not re.match(
              r"^\[V1-\d{2}\]", issue["title"]
          ):
              print("Outside the current V1 issue set; skipped")
              raise SystemExit(0)
          assignees = issue["assignees"]
          if len(assignees) > 1:
              raise SystemExit(
                  "Assignment conflict: keep exactly one human assignee"
              )
          if assignees and assignees[0].get("type") != "User":
              raise SystemExit("A human assignee is required")
          status = (
              "Done" if issue["state"] == "closed"
              else "In progress" if assignees
              else "Todo"
          )
          statuses = {"Todo", "In progress", "Done"}
          labels = [
              label["name"] for label in issue["labels"]
              if label["name"] not in statuses
          ]
          labels.append(status)
          current = {label["name"] for label in issue["labels"]}
          if current != set(labels):
              request("PUT", url + "/labels", {"labels": labels})
          print("Issue #" + number + ": " + status)
          PY
