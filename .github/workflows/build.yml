name: Build and checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend checks and production build
        working-directory: frontend
        run: npm ci && npm run build
      - name: Background refresh preserves mounted content, drafts and access checks
        working-directory: frontend
        run: |
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4174 >/tmp/refresh-preview.log 2>&1 &
          refresh_preview_pid=$!
          trap 'kill "$refresh_preview_pid" 2>/dev/null || true; wait "$refresh_preview_pid" 2>/dev/null || true' EXIT
          python3 -m pip install playwright==1.62.0
          python3 -m playwright install --with-deps chromium webkit
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4174', timeout=2).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              from pathlib import Path
              raise SystemExit(Path('/tmp/refresh-preview.log').read_text())
          PY
          RD08_ROOT=http://127.0.0.1:4174 python3 e2e/background_refresh.py
          RD08_ROOT=http://127.0.0.1:4174 PWA_BROWSER=webkit python3 e2e/background_refresh.py
      - name: Go formatting, vet, race and PostgreSQL migration tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://test:test-only@127.0.0.1:5432/test?sslmode=disable
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build ./cmd/server ./cmd/migrate ./cmd/create-owner
      - name: Missing mandatory configuration fails safely
        working-directory: backend
        run: |
          go build -o /tmp/judeos-server ./cmd/server
          if env -u DATABASE_URL /tmp/judeos-server; then exit 1; fi
      - name: Build production image
        run: docker build -f deploy/Dockerfile -t judeoslite:ci .
      - name: Chromium and WebKit UI, four schedules, PWA and network regression
        run: |
          python3 frontend/e2e/staff_access.py
          PWA_BROWSER=webkit python3 frontend/e2e/staff_access.py
          python3 backend/tests/browser/notifications.py
          PWA_BROWSER=webkit python3 backend/tests/browser/notifications.py
          python3 backend/tests/browser/billing.py
          PWA_BROWSER=webkit python3 backend/tests/browser/billing.py
          python3 backend/tests/browser/documents.py
          PWA_BROWSER=webkit python3 backend/tests/browser/documents.py
          python3 backend/tests/browser/families.py
          PWA_BROWSER=webkit python3 backend/tests/browser/families.py
          python3 frontend/e2e/pwa_v1.py
          PWA_BROWSER=webkit python3 frontend/e2e/pwa_v1.py
          python3 frontend/e2e/redesign_training.py
          PWA_BROWSER=webkit python3 frontend/e2e/redesign_training.py
          python3 frontend/e2e/redesign_reports.py
          PWA_BROWSER=webkit python3 frontend/e2e/redesign_reports.py
          python3 frontend/e2e/redesign_dashboard.py
          PWA_BROWSER=webkit python3 frontend/e2e/redesign_dashboard.py
      - name: Frontend contracts for new modules (synthetic API responses)
        run: |
          npm --prefix frontend run preview -- --host 127.0.0.1 --port 4173 >/tmp/rd08-preview.log 2>&1 &
          rd08_preview_pid=$!
          trap 'kill "$rd08_preview_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:4173', timeout=2).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Frontend preview did not start')
          PY
          python3 frontend/e2e/screenshot_redesign.py
          PWA_BROWSER=webkit python3 frontend/e2e/screenshot_redesign.py
      - name: Deployment policy, controller and server operation tests
        run: python3 -m unittest discover -s deploy/test -p 'test_*.py' -v
      - name: Compose clean startup, migration rerun and restart
        run: bash deploy/check.sh judeoslite-ci
      - name: Disposable Caddy TLS, deploy persistence and backup restore
        run: python3 deploy/test/integration_check.py
