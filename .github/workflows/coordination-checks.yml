name: Coordination checks
on:
  push:
    branches: [main, 'codex/**']
    paths: ['.github/**', 'scripts/claim_issue.py', 'docs/github-issues-v1.json', 'docs/github-issues-redesign.json']
  pull_request:
    paths: ['.github/**', 'scripts/claim_issue.py', 'docs/github-issues-v1.json', 'docs/github-issues-redesign.json']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
